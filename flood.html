<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>The Flood</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&family=Orbitron:wght@800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07060f;--panel:rgba(12,8,30,.82);--text:#eaf4ff;--muted:#a99fd0;--btn:#ff2d95;--btn2:#18c9e8;--line:rgba(155,107,255,.45);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#07060f;--panel:rgba(12,8,30,.82);--text:#eaf4ff;--muted:#a99fd0;--line:rgba(155,107,255,.45)}}
:root[data-theme="dark"]{--bg:#07060f;--panel:rgba(12,8,30,.82);--text:#eaf4ff;--muted:#a99fd0;--line:rgba(155,107,255,.45)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);font-family:"Rajdhani","Trebuchet MS",system-ui,sans-serif;color:var(--text)}
#stage{position:relative;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
canvas{display:block;border-radius:6px;box-shadow:0 0 0 2px rgba(155,107,255,.5),0 10px 60px rgba(160,40,255,.35)}
#stage::after{content:'';position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px)}
#ui{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
.panel{pointer-events:auto;display:flex;flex-direction:column;gap:12px;min-width:min(340px,86vw);max-width:92vw;padding:28px 30px;background:var(--panel);border:2px solid var(--line);border-radius:20px;backdrop-filter:blur(8px);box-shadow:0 0 28px rgba(155,107,255,.3);text-align:center;max-height:94%;overflow:auto}
.panel[hidden]{display:none}
h1{margin:0;font-family:"Orbitron","Rajdhani",sans-serif;font-size:clamp(34px,6.5vw,64px);font-weight:800;line-height:1;color:#ff2d95;text-shadow:0 0 18px rgba(255,45,149,.8),0 0 42px rgba(24,201,232,.45)}
h2{margin:0;font-size:30px}
p{margin:0;color:var(--muted);font-size:16px;line-height:1.35}
button{font:inherit;font-weight:700;font-size:20px;padding:13px 22px;border:0;border-radius:14px;background:var(--btn);color:#fff;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.25);transition:transform .08s,box-shadow .08s}
button:hover{transform:translateY(-2px)}
button:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.25)}
button:focus-visible{outline:3px solid var(--btn2);outline-offset:3px}
button.pf{outline:3px solid #fff;outline-offset:3px;transform:translateY(-2px)}
button:disabled{opacity:.4;cursor:default}
button.alt{background:var(--btn2);color:#041018}
button.ghost{background:transparent;color:var(--text);box-shadow:none;border:2px solid var(--line)}
#tc{position:absolute;inset:0;pointer-events:none;z-index:6;--sz:clamp(64px,17vmin,112px)}
#tc[hidden],.tb[hidden]{display:none}
.tb{position:absolute;bottom:max(16px,env(safe-area-inset-bottom));width:var(--sz);height:var(--sz);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;background:rgba(106,59,214,.45);border:2px solid rgba(255,255,255,.35);pointer-events:auto;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
.tb.on{background:rgba(255,45,149,.75);transform:scale(.94)}
#tl,#tr{font-size:calc(var(--sz)*.45)}
#tl{left:max(16px,env(safe-area-inset-left))}
#tr{left:calc(max(16px,env(safe-area-inset-left)) + var(--sz) + 14px)}
#tj,#ta{font-size:calc(var(--sz)*.2)}
#tj{right:max(16px,env(safe-area-inset-right));background:rgba(255,45,149,.45)}
#ta{right:calc(max(16px,env(safe-area-inset-right)) + var(--sz) + 14px);background:rgba(24,201,232,.4)}
#tz{top:max(10px,env(safe-area-inset-top));left:calc(50% - 23px);bottom:auto;width:46px;height:46px;font-size:18px}
#te{top:max(10px,env(safe-area-inset-top));left:calc(50% + 33px);bottom:auto;width:46px;height:46px;font-size:22px}
.big{font-size:56px;font-weight:700;color:#22e4ff;text-shadow:0 0 16px rgba(34,228,255,.7);line-height:1}
@media (prefers-reduced-motion:reduce){button{transition:none}}
html,body{height:100dvh;overscroll-behavior:none;touch-action:manipulation;-webkit-user-select:none;user-select:none}
#rot{display:none;position:fixed;inset:0;z-index:99;background:rgba(7,6,15,.96);align-items:center;justify-content:center;flex-direction:column;gap:14px;text-align:center;font-size:24px;font-weight:700;padding:24px}
#rot b{font-size:64px;line-height:1}
@media (orientation:portrait) and (pointer:coarse){#rot{display:flex}}
@media (max-height:520px){
 .panel{padding:10px 16px;gap:6px;border-radius:14px}
 h1{font-size:34px}h2{font-size:22px}p{font-size:13px}
 button{font-size:16px;padding:8px 14px;border-radius:10px}
 .big{font-size:40px}
}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas>
<div id="ui">
 <div class="panel" id="p-over" hidden><h2 data-t="over">Überschwemmt!</h2><div class="big" id="o-score">0</div><p id="o-note"></p>
  <button data-a="next" data-t="next">Weiter</button></div>
 <div class="panel" id="p-pause" hidden><h2 data-t="pause">Pause</h2><p id="pz-note"></p>
  <button id="b-resume" data-a="resume" data-t="next">Weiter</button><button class="alt" id="b-drop" data-a="drop" hidden data-t="drop">Ohne sie weiter</button><button class="alt" data-a="restart" data-t="restart">Neustart</button><button class="ghost" data-a="main" data-t="menu">Zum Menü</button></div>
</div>
<div id="tc" hidden>
 <div class="tb" id="tl" data-k="l">◀</div><div class="tb" id="tr" data-k="r">▶</div>
 <div class="tb" id="ta" data-k="a" data-t="grab">Greifen</div><div class="tb" id="tj" data-k="j" data-t="jump">Sprung</div>
 <div class="tb" id="te" data-k="e">♥</div><div class="tb" id="tz" data-k="pz">II</div>
</div></div>
<div id="rot"><b>↻</b><span data-t="rot">Bitte das Handy quer halten.</span></div>
<script>
var FXQ=1,PRQ=1,FK=1; /* von der Hauptseite gesetzt: Glühfaktor, Pixel-Ratio; FK = Canvas-Skalierung */
/* Texte zentral (für späteres Englisch, 24.11.2026). Elemente mit data-t werden beim Start aus FT gefüllt. */
const FT={over:'Überschwemmt!',next:'Weiter',pause:'Pause',drop:'Ohne sie weiter',restart:'Neustart',menu:'Zum Menü',grab:'Greifen',jump:'Sprung',rot:'Bitte das Handy quer halten.',blur:'Fenster nicht aktiv.',
 hints:['Spieler 1: A D W + S','Spieler 2: ← → ↑ + ↓','Spieler 3: J L I + K','Spieler 4: Num 4 6 8 + 5','','','',''],names:['Rot','Cyan','Grün','Pink','Gelb','Orange','Lila','Weiß'],
 shield:'Schild kaputt',rising:'Das Wasser steigt! Klettere nach oben.',pl:'Spieler ',back:' ist zurück!',capLost:'Kapsel verloren',newRec:'Neuer Rekord!',best:'Beste Punktzahl: ',pts:'Punkte ',
 hTouch:'◀ ▶ laufen · Sprung-Taste springen · ♥ Emote',hKb:'A / D oder ← / → laufen · W, ↑ oder Leertaste springen · E Emote',others:'× Controller/Handy/Touch',lostA:'Verbindung verloren: ',lostB:'. Das Handy verbindet sich von selbst wieder.',paused:'Das Spiel ist angehalten.',pby:' hat pausiert.',rsq:'Wirklich neu starten?'};
document.querySelectorAll('[data-t]').forEach(e=>{e.textContent=FT[e.dataset.t]});
const W=1280,H=720,S=44,MAXG=800;
const cv=document.getElementById('c');let ctx=cv.getContext('2d');cv.width=W;cv.height=H;
const $=id=>document.getElementById(id);
const DIFF=[{n:'Leicht',f:1.4},{n:'Normal',f:1},{n:'Schwer',f:.72}];
let cfg={sound:true,music:true,vib:true,rain:true,diff:1},bestVal=0;
function fit(){const st=$('stage'),s=Math.min(st.clientWidth/W,st.clientHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px';const k=Math.min(2.5,Math.max(.4,s*PRQ)),cw=Math.round(W*k),chh=Math.round(H*k);if(cv.width!==cw||cv.height!==chh){cv.width=cw;cv.height=chh}FK=k}
addEventListener('resize',fit);fit();

/* ---------- Hintergrund (einmal vorgerendert) ---------- */
const bg=document.createElement('canvas');bg.width=W;bg.height=H;
(function(){const b=bg.getContext('2d');
 const gr=b.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#04050d');gr.addColorStop(.45,'#150a33');gr.addColorStop(.8,'#4a1360');gr.addColorStop(1,'#7a1f6c');b.fillStyle=gr;b.fillRect(0,0,W,H);
 for(let i=0;i<90;i++){b.fillStyle='rgba(255,255,255,'+(.2+Math.random()*.5)+')';b.fillRect(Math.random()*W,Math.random()*300,1.5,1.5)}
 for(let i=0;i<10;i++){const x=Math.random()*W,y=30+Math.random()*240,r=80+Math.random()*120,rg=b.createRadialGradient(x,y,0,x,y,r);rg.addColorStop(0,'rgba(90,40,150,.35)');rg.addColorStop(1,'rgba(90,40,150,0)');b.fillStyle=rg;b.fillRect(x-r,y-r,r*2,r*2)}
 const hz=b.createLinearGradient(0,400,0,H);hz.addColorStop(0,'rgba(255,45,149,0)');hz.addColorStop(1,'rgba(255,45,149,.3)');b.fillStyle=hz;b.fillRect(0,400,W,H-400);
 [{base:610,a:110,z:300,col:'#150d33',win:'rgba(34,228,255,',n:.35},{base:630,a:60,z:200,col:'#0a0620',win:'rgba(255,60,200,',n:.5}].forEach(L=>{let x=-20;
  while(x<W){const w=40+Math.random()*70,h=L.a+Math.random()*(L.z-L.a);b.fillStyle=L.col;b.fillRect(x,L.base-h,w,h+200);b.fillStyle=L.win+'.4)';b.fillRect(x,L.base-h,w,2);
   for(let wy=L.base-h+10;wy<L.base-6;wy+=12)for(let wx=x+6;wx<x+w-6;wx+=10)if(Math.random()<L.n){b.fillStyle=Math.random()<.75?L.win+'.55)':'rgba(255,220,120,.55)';b.fillRect(wx,wy,4,6)}
   if(Math.random()<.22){b.save();b.shadowColor='#ff2d95';b.shadowBlur=14;b.fillStyle='rgba(255,70,170,.9)';b.fillRect(x+w*.2,L.base-h+18,w*.6,7);b.restore()}
   else if(Math.random()<.15){b.save();b.shadowColor='#22e4ff';b.shadowBlur=14;b.fillStyle='rgba(60,235,255,.9)';b.fillRect(x+w-9,L.base-h+14,5,36);b.restore()}
   x+=w+(Math.random()<.5?0:6)}});
})();
const spr={};
function crateSprite(sz,k){const key=sz+k;if(spr[key])return spr[key];const cn=document.createElement('canvas');cn.width=cn.height=sz;const b=cn.getContext('2d');
 const fr={n:'#5aa0ff',x:'#ff4a2e',g:'#ffe14a'}[k],bd={n:'#141a33',x:'#2a0e12',g:'#33290a'}[k];
 b.fillStyle=bd;b.fillRect(0,0,sz,sz);
 b.strokeStyle='rgba(255,255,255,.06)';b.lineWidth=1;for(let y=11;y<sz;y+=11){b.beginPath();b.moveTo(0,y);b.lineTo(sz,y);b.stroke()}
 b.shadowColor=fr;b.shadowBlur=6;b.strokeStyle=fr;b.lineWidth=sz>S?5:3.5;b.strokeRect(3,3,sz-6,sz-6);
 const m=sz>S?18:8;if(sz>S)b.strokeRect(m,m,sz-2*m,sz-2*m);
 b.lineWidth=sz>S?4:2.5;b.beginPath();b.moveTo(m,m);b.lineTo(sz-m,sz-m);b.moveTo(sz-m,m);b.lineTo(m,sz-m);b.stroke();b.shadowBlur=0;
 b.fillStyle=fr;[[7,7],[sz-7,7],[7,sz-7],[sz-7,sz-7]].forEach(q=>{b.beginPath();b.arc(q[0],q[1],sz>S?3:1.8,0,6.3);b.fill()});
 if(k!=='n'){b.fillStyle=k==='x'?'#fff':'#fff6c0';b.strokeStyle=bd;b.lineWidth=5;b.font='700 '+(sz*.55|0)+'px Rajdhani,sans-serif';b.textAlign='center';b.strokeText(k==='x'?'!':'$',sz/2,sz*.7);b.fillText(k==='x'?'!':'$',sz/2,sz*.7)}
 return spr[key]=cn}

/* ---------- Zustand ---------- */
const g=new Float32Array(W),keys={};
const cg=new Float32Array(W).fill(1e9),cb=new Float32Array(W);
const lay=document.createElement('canvas');lay.width=W;lay.height=H;const lctx=lay.getContext('2d');
const gAt=x=>{const i=x<0?0:x>=W?W-1:x|0;return g[i]<cg[i]?g[i]:cg[i]};
function resetTerrain(){cg.fill(1e9);for(let x=0;x<W;x++)g[x]=600+Math.sin(x/170)*14+Math.sin(x/47)*5}
resetTerrain();
let state='menu',mode=1,t=0,time=0,players=[],crates=[],rockets=[],parts=[],shake=0,flash=0,nextCrate=0,nextRocket=0,endT=0,wl=692;
const drops=Array.from({length:170},()=>({x:Math.random()*W,y:Math.random()*H,l:10+Math.random()*14,v:900+Math.random()*400}));
const down=a=>a.some(k=>keys[k]);
addEventListener('keydown',e=>{keys[e.code]=true;try{parent.fKey(e,1)}catch(_){}if(state==='play'&&!e.repeat){const k=EK.indexOf(e.code);if(k>=0){const p=mode===1?players[0]:players.find(z=>z.i===k);if(p&&p.pad==null)emote(p)}}if(/^(Arrow|Space)/.test(e.code))e.preventDefault();if((e.code==='Escape'||e.code==='KeyP')&&!e.repeat){if(state==='play')pauseGame('');else if(state==='pause')togglePause()}});
addEventListener('keyup',e=>{keys[e.code]=false;try{parent.fKey(e,0)}catch(_){}});
addEventListener('blur',()=>{for(const k in keys)keys[k]=false;if(state==='play')pauseGame(FT.blur)});

/* ---------- Ton ---------- */
let ac;function initAudio(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume()}
function sfx(k,v){if(!cfg.sound||!ac)return;const n=ac.currentTime;
 if(k==='boom'){const len=ac.sampleRate*.7|0,buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.4);
  const s=ac.createBufferSource(),f=ac.createBiquadFilter(),gn=ac.createGain();s.buffer=buf;f.type='lowpass';f.frequency.value=650;gn.gain.value=.55*v/60;
  s.connect(f);f.connect(gn);gn.connect(ac.destination);s.start(n)}
 else if(k==='emote'){const o=ac.createOscillator(),gn=ac.createGain();o.type='sine';o.frequency.setValueAtTime(660,n);o.frequency.exponentialRampToValueAtTime(990,n+.12);gn.gain.setValueAtTime(.12,n);gn.gain.exponentialRampToValueAtTime(.001,n+.2);o.connect(gn);gn.connect(ac.destination);o.start(n);o.stop(n+.22)}
 else{const o=ac.createOscillator(),gn=ac.createGain();o.frequency.setValueAtTime(120,n);o.frequency.exponentialRampToValueAtTime(40,n+.15);
  gn.gain.setValueAtTime(.2,n);gn.gain.exponentialRampToValueAtTime(.001,n+.18);o.connect(gn);gn.connect(ac.destination);o.start(n);o.stop(n+.2)}}

/* ---------- Musik ---------- */
const MUS={next:0,step:0,gain:null,noise:null},PROG=[[0,[0,3,7]],[-4,[0,4,7]],[3,[0,4,7]],[-2,[0,4,7]]],ARP=[0,1,2,1,2,1,0,2];
function mNote(f,t0,d,ty,v){const o=ac.createOscillator(),gn=ac.createGain();o.type=ty;o.frequency.setValueAtTime(f,t0);gn.gain.setValueAtTime(.0001,t0);gn.gain.exponentialRampToValueAtTime(v,t0+.012);gn.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(gn);gn.connect(MUS.gain);o.start(t0);o.stop(t0+d+.03)}
function mKick(t0){const o=ac.createOscillator(),gn=ac.createGain();o.frequency.setValueAtTime(130,t0);o.frequency.exponentialRampToValueAtTime(42,t0+.13);gn.gain.setValueAtTime(.32,t0);gn.gain.exponentialRampToValueAtTime(.0001,t0+.16);o.connect(gn);gn.connect(MUS.gain);o.start(t0);o.stop(t0+.18)}
function mHat(t0,v){if(!MUS.noise){const len=ac.sampleRate*.05|0,b=ac.createBuffer(1,len,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*(1-i/len);MUS.noise=b}
 const s=ac.createBufferSource(),f=ac.createBiquadFilter(),gn=ac.createGain();s.buffer=MUS.noise;f.type='highpass';f.frequency.value=7000;gn.gain.value=v;s.connect(f);f.connect(gn);gn.connect(MUS.gain);s.start(t0)}
function musicTick(){if(!ac||!cfg.sound||!cfg.music||state!=='play'){MUS.next=0;return}
 if(ac.state!=='running')return;
 if(!MUS.gain){MUS.gain=ac.createGain();MUS.gain.gain.value=.55;MUS.gain.connect(ac.destination)}
 const now=ac.currentTime;if(!MUS.next||MUS.next<now-.3)MUS.next=now+.05;
 const pr=Math.max(0,Math.min(1,(692-wl)/582)),sd=60/(92+88*pr)/2;
 while(MUS.next<now+.25){const s=MUS.step++,t0=MUS.next,c=PROG[(s>>2)&3];
  if(!(s&1))mNote(110*Math.pow(2,c[0]/12),t0,sd*1.9,'triangle',.22);
  mNote(440*Math.pow(2,(c[0]+c[1][ARP[s&7]])/12),t0,sd*.9,'square',.035+.02*pr);
  if(pr>.12&&!(s&1))mKick(t0);
  if(pr>.35&&(s&1||pr>.65))mHat(t0,.05);
  MUS.next+=sd}}

/* ---------- Spiel ---------- */
let warned=0,items=[],texts=[],bonus=0,slow=0,hail=0,nextHail=22,nextItem=6;
const sc=()=>Math.floor(t*10)+bonus;
let slots=[],caps=[],ghosts=[];
const PRGB=['255,46,77','34,228,255','57,255,106','255,79,216','255,225,60','255,140,40','170,110,255','235,240,255','61,123,255','198,255,61','194,122,61','25,230,180','255,176,138','207,60,255','74,70,104','234,161,0'],NAMES=FT.names,HINTS=FT.hints;
const CTL=[[['KeyA'],['KeyD'],['KeyW','Space'],['KeyS']],[['ArrowLeft'],['ArrowRight'],['ArrowUp'],['ArrowDown']],[['KeyJ'],['KeyL'],['KeyI'],['KeyK']],[['Numpad4'],['Numpad6'],['Numpad8'],['Numpad5']]];
const EK=['KeyE','ShiftRight','KeyO','Numpad9'];
const TB={l:0,r:0,j:0,a:0,e:0},TBL={l:0,r:0,j:0,a:0};
function vib(p,pat){if(p&&typeof p.pad==='number'&&(Array.isArray(pat)||pat>=30)){try{parent.gpRumble('gp'+p.pad,pat)}catch(_){}}if(p&&typeof p.pad==='string'&&p.pad.slice(0,3)==='ph:'&&(Array.isArray(pat)||pat>=30)){try{parent.hitPad(p.pad)}catch(_){}}if(cfg.vib&&p&&p.pad==='touch'&&navigator.vibrate)try{navigator.vibrate(pat)}catch(e){}}
function emote(p,e){if(!e||!p.alive||state!=='play'||(p.em&&p.em.t<.4))return;p.em={k:'emo',e:e||p.emo||'😂',t:0};burst(p.x+p.w/2,p.y-6,8,120,'255,210,90',4,.7,0,'glow');sfx('emote')}
function emoteEmoji(id,e){const p=players.find(q=>q.pad==='ph:'+id);if(p)emote(p,e)}
const crowd=n=>1+.16*Math.min(n-1,3)+.1*Math.max(0,n-4);
function hintLine(){const kb=slots.filter(q=>q.pad==null).map(q=>HINTS[q.i]).filter(Boolean),o=slots.length-kb.length;if(o)kb.push(o+FT.others);return kb.join('   ·   ')}
function pop(x,y,s,c,sz){sz=sz||1;texts.push({x,y,s,c,sz,life:sz>1?2.2:1.2})}
function mkP(i,x,solo){const w=26,h=38;let top=1e9;for(let k=x|0;k<=(x+w|0);k++)top=Math.min(top,gAt(k));
 return{i,x,y:top-h,w,h,vx:0,vy:0,on:true,dir:1,alive:true,deathT:0,air:5,col:'rgb('+PRGB[i]+')',rgb:PRGB[i],

function loop(now){const dt=Math.min(.033,(now-last)/1000);last=now;const fz=state==='pause'||(state==='menu'&&window.APHOLD);if(!fz)time+=dt;if(state==='menu'){requestAnimationFrame(loop);return}phoneTick();musicTick();if(state==='pause')refreshPause();touchUI();menuPad();if(!fz){update(slow>0?dt*.35:dt);slow=Math.max(0,slow-dt)}draw();requestAnimationFrame(loop)}
addEventListener('resize',()=>{if(state==='play'&&matchMedia('(orientation:portrait) and (pointer:coarse)').matches)pauseGame(FT.rot)});
requestAnimationFrame(loop);

/* ---------- Schnittstelle fuer die Hauptseite (ersetzt eval von aussen) ---------- */
window.PA={
 emote(slot,e){const q=players.find(z=>z.i===slot);if(q&&q.alive&&state==='play'){emote(q,e);return true}return false},
 freeze(slot,v){const q=players.find(z=>z.i===slot);if(q)q.ew=v},
 /* Figur-Vorschau (Lobby, Bestenliste) */
 drawPreview(c2,i,ch,hat,rgb){const m=ctx,md=mode;ctx=c2;mode=1;try{playerDraw({i,ch,hat,x:18,y:26,w:26,h:38,vx:0,vy:0,on:true,dir:1,alive:true,air:5,col:'rgb('+(rgb||PRGB[i])+')',inv:0,shield:0})}finally{ctx=m;mode=md}},
 /* Figur im Hindernisrennen */
 drawRacer(c2,i,ch,hat,vx,vy,on,dir,inv,rgb){const m=ctx,md=mode;ctx=c2;mode=1;try{playerDraw({i,ch,hat,x:0,y:0,w:26,h:38,vx,vy,on,dir,alive:true,air:5,col:'rgb('+(rgb||PRGB[i])+')',inv,shield:0})}finally{ctx=m;mode=md}},
 configure(o){cfg.sound=true;cfg.music=true;cfg.vib=true;cfg.rain=!!o.rain;cfg.diff=o.diff;bestVal=o.best|0;
  if(ac){if(!ac.__bus){const real=ac.destination,bus=ac.createGain();bus.connect(real);Object.defineProperty(ac,'destination',{get:()=>bus,configurable:true});ac.__bus=bus;if(!MUS.gain){MUS.gain=ac.createGain();MUS.gain.connect(real)}}
   ac.__bus.gain.value=o.sfx;MUS.gain.gain.value=.55*o.mus}},
 getState(){return state},
 toMenu(){state='menu';show(null)},
 score(){return sc()},
 results(){return players.map(p=>({i:p.i,rv:p.fd!=null&&p.alive?1:0,d2:p.alive?1e9:(p.deathT||0),d:p.fd!=null?p.fd:p.alive?1e9:(p.deathT||0)}))}
};
</script>
