<!DOCTYPE html><html lang="de"><head><meta charset="utf-8">

<style>
:root{--bg:#17123a;--tx:#f6f3ff;--mu:#b5aee6;--ln:#4b3f8f;--gold:#ffc83d}
*{box-sizing:border-box}

body{background:linear-gradient(160deg,#2b1760 0%,var(--bg) 55%,#0f2a4a 100%);color:var(--tx);font:700 clamp(16px,2.2vmin,24px) Rajdhani,system-ui,sans-serif;overflow:hidden}

section{position:absolute;inset:0;padding:3vh 4vw;display:none;flex-direction:column;align-items:center;gap:2.2vh}

small{color:var(--mu);font-weight:600}
button{font:inherit;font-weight:700;padding:.5em 1.1em;border:2px solid var(--ln);border-radius:12px;background:transparent;color:var(--tx);cursor:pointer}
.join{display:flex;align-items:center;gap:24px}
#qr{display:none;background:#fff;padding:8px;border-radius:10px;line-height:0;min-width:166px;min-height:166px}
.grid8{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;width:min(960px,94vw)}
.sl{min-width:0;overflow:hidden;position:relative;border:3px dashed var(--ln);border-radius:20px;padding:12px 8px 8px;text-align:center;color:var(--mu);min-height:150px}

.sl.in{border:3px solid var(--c);background:color-mix(in srgb,var(--c) 20%,transparent);color:var(--tx)}
.sl.rd{box-shadow:0 0 0 4px var(--c),0 0 28px var(--c)}
.av{width:58px;height:58px;border-radius:50% 50% 42% 42%;background:var(--c);margin:0 auto 6px;position:relative}
.av::before,.av::after{content:'';position:absolute;top:21px;width:12px;height:15px;background:#fff;border-radius:50%;box-shadow:inset 0 -5px 0 #1a1030}
.av::before{left:12px}.av::after{right:12px}
.hat{position:absolute;top:-24px;left:0;right:0;text-align:center;font-size:30px;line-height:1}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;width:min(1100px,94vw)}
.rows{width:min(640px,90vw);display:flex;flex-direction:column;gap:12px;font-size:1.35em}

.rw.sel{border-color:var(--gold);background:#ffc83d26;box-shadow:0 0 24px #ffc83d55}.rw.go{justify-content:center;font-family:Bungee,Impact,sans-serif;font-weight:400}.rw b{color:var(--gold)}
.tile{border:3px solid var(--ln);border-radius:18px;padding:14px;text-align:center;background:#ffffff0d;display:flex;flex-direction:column;gap:2px;min-width:0}

#board{display:flex;flex-wrap:wrap;gap:10px 22px;justify-content:center}
.bp{display:flex;align-items:center;gap:8px}.bp i{width:16px;height:16px;border-radius:50%;background:var(--c)}.bp b{color:var(--gold);font-size:1.3em}
#dc{font-family:Bungee,Impact,sans-serif;font-size:clamp(70px,22vmin,220px);color:var(--gold);line-height:1;text-shadow:6px 6px 0 #ff2d95}
.bars{width:min(900px,92vw);display:flex;flex-direction:column;gap:8px}
.bar{display:flex;align-items:center;gap:10px}.bar div{height:22px;border-radius:11px;background:var(--c);min-width:6px;transition:width .1s}

#fl{position:absolute;inset:0;width:100%;height:100%;border:0;visibility:hidden;z-index:5;background:#000}#fl.on{visibility:visible}
.dp{display:grid;grid-template-columns:24px 62px 24px;grid-template-rows:22px 79px 22px;gap:3px;justify-content:center;align-items:center;justify-items:center;margin:4px 0 2px}

.ab{width:22px;height:22px;padding:0;border:0;border-radius:50%;background:#ffffff26;color:#fff;font-size:10px;line-height:22px;text-align:center}

.sl .lv{position:absolute;top:6px;right:6px;z-index:3;opacity:.55}.sl .lv:hover{opacity:1;background:#ff2d95}
.ab:hover{background:#ffffff55}.ab:disabled{opacity:.3;cursor:default}.ab:disabled:hover{background:#ffffff26}
.ab.u{grid-area:1/2}.ab.l{grid-area:2/1}.ab.r{grid-area:2/3}.ab.d{grid-area:3/2}
.sl .cw{position:absolute;top:12px;left:6px;font-size:1.5em;line-height:1;transform:rotate(-14deg);z-index:2;filter:drop-shadow(0 2px 4px #000a)}
.sl .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.2}
.sl .fn{overflow:hidden;text-overflow:ellipsis;font-size:.8em;color:var(--mu);white-space:nowrap;line-height:1.2}
.cr{display:flex;align-items:center;justify-content:center;gap:2px}.cr .hn{width:126px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}.sw{display:inline-block;width:11px;height:11px;border-radius:50%;background:var(--c);margin-right:6px;vertical-align:-1px;box-shadow:0 0 0 2px #ffffff55}
.rb{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;margin:6px auto 0;padding:5px 10px;font-size:.78em;border:2px solid #ffffff55;border-radius:999px;background:#ffffff14;color:var(--tx);white-space:nowrap}.rb:hover{background:#ffffff30}.rb.ok{background:#3ddc6a;border-color:#3ddc6a;color:#06210f}
.sl .hn{display:block;font-size:.8em;color:var(--tx);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
#legend{display:grid;grid-template-columns:repeat(2,auto);gap:3px 28px;font-size:.72em;line-height:1.25;color:var(--mu);text-align:left;max-width:96vw}#legend b{color:var(--tx)}#legend .t{grid-column:1/-1;text-align:center}
.nmi{text-transform:uppercase;display:block;width:68%;margin:0 auto;background:transparent;border:0;border-bottom:1px dashed #ffffff66;color:var(--tx);font:inherit;font-weight:700;text-align:center;padding:0;line-height:1.2;outline:0}
.nmi:focus{border-bottom:1px solid var(--gold)}
.nme{display:flex;flex-wrap:wrap;justify-content:center;font-weight:700;line-height:1.2;min-height:1.2em}
.nme span{min-width:.55em;text-align:center;border-bottom:2px solid #ffffff55;margin:0 1px}
.nme span.ac{color:var(--gold);border-bottom-color:var(--gold)}
.nmh{font-size:.62em;color:#b5aee6;text-align:center;line-height:1.25;margin-top:2px}
#cd{position:fixed;left:0;top:0;width:100vw;height:100vh;height:100dvh;box-sizing:border-box;display:none;flex-direction:column;align-items:center;justify-content:center;gap:2vh;background:#0b0820d9;backdrop-filter:blur(4px);z-index:80}
#cd.on{display:flex}
#bm,#rc,#sm,#bo,#fk{padding:0;gap:0;justify-content:center}
#cdn{font-family:Bungee,Impact,sans-serif;font-size:clamp(90px,26vmin,260px);color:var(--gold);line-height:1;text-shadow:6px 6px 0 #ff2d95}
canvas.pv{width:54px;height:69px}.sl canvas.pv{width:62px;height:79px}.bp canvas.pv{width:30px;height:38px}ol li canvas.pv{width:38px;height:48px}
ol{padding:0;margin:0;list-style:none;display:flex;flex-direction:column;gap:10px;width:min(560px,90vw);font-size:1.3em}

h3{font-family:Bungee,Impact,sans-serif;font-weight:400;margin:0 0 10px;font-size:clamp(18px,2.6vmin,28px);color:var(--mu)}
.hsg{display:grid;grid-template-columns:1fr 1fr;gap:3vw;width:min(1100px,94vw);flex:1 1 auto;min-height:0;overflow:auto;align-items:start}
.hsg ol{width:100%;font-size:1.1em;gap:8px}
.hsg ol li{flex-wrap:wrap}
.hsg ol li span.n{width:1.6em;color:var(--mu)}
.rc{color:var(--gold)}
.sl.in.tm{border-color:var(--tm)}.sl.tm::before{content:'';position:absolute;left:0;right:0;top:0;height:9px;background:var(--tm)}
.tmb{display:inline-block;font-size:.62em;padding:1px 9px;border-radius:999px;background:var(--t);color:#14102e;margin-left:6px;vertical-align:middle;font-weight:700}
@media(max-width:700px){.hsg{grid-template-columns:1fr}}
#emf{position:fixed;inset:0;pointer-events:none;z-index:50;overflow:hidden}

#trn,#tfin{overflow:auto}
.tg{font-family:Bungee,Impact,sans-serif;font-size:clamp(28px,6.5vmin,68px);color:var(--gold);text-align:center;transform:rotate(-1.5deg);text-shadow:4px 4px 0 #ff2d95}

.tw canvas.pv{width:96px;height:122px}
.tw{animation:twp .8s cubic-bezier(.2,1.6,.4,1) .15s both}@keyframes twp{from{transform:scale(.2) rotate(-14deg);opacity:0}to{transform:none;opacity:1}}
#tfl li,#tfs span,#tfr span{animation:tfi .45s ease-out both}@keyframes tfi{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media(max-height:560px){#trn,#tfin{gap:1vh}#trl li,#tfl li{padding:2px 10px}#trl li canvas.pv,#tfl li canvas.pv{width:24px;height:30px}.tw canvas.pv{width:64px;height:82px}}
#tp{position:fixed;inset:0;pointer-events:none;z-index:70;--ts:clamp(40px,11vmin,68px)}
#tp[hidden],#tpc[hidden]{display:none}

#tdp{position:absolute;left:max(14px,env(safe-area-inset-left,0px));bottom:max(14px,env(safe-area-inset-bottom,0px));width:calc(var(--ts)*3);height:calc(var(--ts)*3);border-radius:50%;background:#ffffff14;border:2px solid #ffffff33;pointer-events:auto}

#tdp i[data-d=d]{left:50%;bottom:0;margin-left:calc(var(--ts)/-2)}
#tdp i[data-d=l]{left:0;top:50%;margin-top:calc(var(--ts)/-2)}

#tp button{position:absolute;pointer-events:auto;display:flex;align-items:center;justify-content:center;padding:0;border-radius:50%;border:2px solid #ffffff55;background:#ffffff22;color:#fff;font:400 calc(var(--ts)*.5) Bungee,system-ui,sans-serif;opacity:.65}

#tbA{width:calc(var(--ts)*1.4);height:calc(var(--ts)*1.4);right:max(14px,env(safe-area-inset-right,0px));bottom:calc(max(14px,env(safe-area-inset-bottom,0px)) + var(--ts)*.9)}
#tbB{width:calc(var(--ts)*1.4);height:calc(var(--ts)*1.4);right:calc(max(14px,env(safe-area-inset-right,0px)) + var(--ts)*1.55);bottom:max(14px,env(safe-area-inset-bottom,0px))}
#tbE{width:calc(var(--ts)*.95);height:calc(var(--ts)*.95);right:calc(max(14px,env(safe-area-inset-right,0px)) + var(--ts)*1.8);bottom:calc(max(14px,env(safe-area-inset-bottom,0px)) + var(--ts)*1.7)}

/* Themes */
body.th1{--bg:#120d06;--tx:#f7ecd0;--mu:#cfae6a;--ln:#8a6420;--gold:#ffb000;background:radial-gradient(ellipse at center,#2a1c0a 0%,#120d06 75%)}

#tpc{left:max(8px,env(safe-area-inset-left,0px));transform:none}
/* Spielfläche weicht den Touch-Tasten aus (--tpr = Breite pro Seite, aus apPW()) */
#fl{left:var(--tpr,0px);width:calc(100% - 2*var(--tpr,0px))}
body.apmenu #tp{display:none}
.fw{display:flex;flex-direction:column;align-items:center;gap:inherit;width:100%;transform-origin:top center}

/* ===== Spiel-Schnittstelle =====
 Jedes Spiel registriert sich in GS[<screen>] = {input(p,dn), pauseKey(repeat), blur()}.
  - input: Eingabe eines Spielers (dn(bit) = Taste frisch gedrueckt)
  - pauseKey: Esc/P am Rechner, liefert true wenn das Spiel die Taste verwendet hat

  $(c.rows).innerHTML=B.pzm.map((a,i)=>`<div class="rw go ${i===B.pzi?'sel':''}" onclick="${c.click}(${i})">${T[a]}</div>`).join('')};
 const pause=(v,by)=>{const B=o();if(!B||B.done)return;if(c.strict&&!!v===!!B.pz)return;B.rsq=0;
  if(c.onPause)c.onPause(B,!!v);
  B.pz=v?1:0;B.pby=v&&by?by:'';B.pzi=0;B.lost=v&&c.lost?c.lost():[];B.lk=B.lost.map(q=>q.p.id).join();
  zone().classList.toggle('on',!!v);render();B.last=performance.now()};
 const close=()=>{zone().classList.remove('on');const B=o();if(B){B.done=1;B.pz=0}if(c.onClose)c.onClose()};
 const click=i=>{const B=o(),a=B.pzm[i];if(a!=='rs')B.rsq=0;
  if(a==='rs'){if(B.rsq){close();return c.restart()}B.rsq=1;render()}
  else if(a==='quit'){close();show('menu')}
  else if(a==='drop'){c.drop();B.lost=[];B.lk='';B.pzi=0;render()}
  else pause(0)};

  if(dn(32)||dn(64)){B.rsq=0;B.pzi=(B.pzi+1)%B.pzm.length;render()}
  else if(dn(8)||dn(16)){if(!(B.lost&&B.lost.length))pause(0)}
  else if(dn(4))click(B.pzi)};

 const watch=()=>{const B=o();if(!B)return;
  if(B.pz){if(!c.lost)return;const l=c.lost(),k=l.map(q=>q.p.id).join();if(k!==B.lk){B.lk=k;B.lost=l;B.pzi=0;render()}}
  else if(c.autoPause&&c.autoPause(B)&&c.lost&&c.lost().length)pause(1)};

const W=1280,H=720,CX=640,CY=400,R0=290,PR=24,SPD=225,DV=640,DDUR=.24,DCD=1.1,BDUR=.5,BCD=1.5,PERF=.17,
 STG=[[9,252],[19,214],[29,180],[39,150],[49,124],[59,102]],SPF=[1.3,1,.75],BSK=[.7,1,1.25],rnd=Math.random,hyp=Math.hypot;
let SM=null;

/* --- Helfer --- */
const fx=(x,y,n,col,sp,life)=>{for(let i=0;i<n;i++){const a=rnd()*6.283,v=(.3+rnd())*(sp||200);SM.pa.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,t:life||.5,L:life||.5,c:col,s:3+rnd()*4})}};
const pop=(x,y,s,c)=>SM.tx.push({x,y,s,c:c||'#ffc83d',t:1.1});
const banner=s=>{SM.bn={s,t:2.3}};
const alive=()=>SM.pl.filter(q=>q.al);

/* --- Aktionen --- */
function doDash(q){if(!q||!q.al||q.dcd>0||q.stun>0||q.blk>0||q.dash>0)return;
 q.dash=DDUR;q.dcd=DCD;q.kx=q.fx*DV;q.ky=q.fy*DV;q.vx=q.vy=0;q.an.sq=-.7;fx(q.x,q.y+PR,8,'#ffffff',170,.3);beep(cfgG.sfx,0,740)}
function doBlock(q){if(!q||!q.al||q.bcd>0||q.stun>0||q.dash>0||q.blk>0)return;
 q.blk=BDUR;q.bcd=BCD;q.an.sq=.8;q.kx*=.3;q.ky*=.3;beep(cfgG.sfx,1,300)}
function act(id,k){const B=SM;if(!B||B.cd>0||B.end!=null||B.pz)return;const q=B.pl.find(q=>q.p.id===id);if(k===4)doDash(q);else doBlock(q)}
function emo(q,e){if(q.bot||!q.al||(SM&&SM.pz)||(q.em&&q.em.t>1.8))return;q.em={e:e||EMOS[0],t:2.2};beep(cfgG.sfx,0)}
window.smEmoji=(id,e)=>{const q=SM&&SM.pl.find(q=>q.p.id===id);if(!q)return;if(q.al)emo(q,e);else emoFloat(q.p,e)};

function out(q,quiet){const B=SM;if(!q.al)return;q.al=0;q.dt=B.t;stb(q.p,'d');
 if(quiet)return;padBuzz(q.p);
 const lh=q.lh;if(lh&&lh.q!==q&&B.t-lh.t<4){stb(lh.q.p,'k');pop(q.x,Math.max(120,q.y-60),'🎯 '+lh.q.p.name.slice(0,8),'#ffffff')}
 B.fa.push({spr:q.spr,x:q.x,y:q.y,vx:q.vx+q.kx,vy:q.vy+q.ky,t:0,r:0,tv:(rnd()<.5?-1:1)*(4+rnd()*4)});
 B.sh=Math.max(B.sh,.55);fx(q.x,q.y,16,pcol(q.p),260,.7);beep(cfgG.sfx,0,440);setTimeout(()=>beep(cfgG.sfx,0,220),120)}

/* --- Treffer --- */
function hit(a,b,nx,ny){const B=SM;const cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;
 if(b.blk>0){const pf=b.blk>BDUR-PERF;
  a.dash=0;a.stun=pf?1.1:.35;a.kx=-nx*(pf?560:360);a.ky=-ny*(pf?560:360);b.kx+=nx*40;b.ky+=ny*40;
  fx(cx,cy,pf?24:12,pf?'#ffffff':'#7ff2ff',pf?340:220,.45);pop(cx,cy-40,pf?TX_UI.parry:TX_UI.blocked,pf?'#ffffff':'#7ff2ff');
  B.sh=Math.max(B.sh,pf?.55:.3);if(pf){B.hs=.09;a.an.sq=1;stb(b.p,'s')}beep(cfgG.sfx,1,pf?520:260);return}
 const m=1+b.dmg/70;b.kx=nx*620*m;b.ky=ny*620*m;b.vx=b.vy=0;b.dmg=Math.min(300,b.dmg+17);b.stun=.3;b.an.sq=1;b.lh={q:a,t:B.t};
 a.dash=0;a.kx=nx*70;a.ky=ny*70;a.an.sq=-.3;
 B.hs=.08;B.sh=Math.max(B.sh,.4+Math.min(.5,b.dmg/300));fx(cx,cy,18,'#ffc83d',320,.5);fx(cx,cy,8,'#ffffff',200,.3);
 pop(b.x,b.y-70,Math.round(b.dmg)+'%',b.dmg>120?'#ff4d4d':'#ffc83d');stb(a.p,'s');padBuzz(b.p);beep(cfgG.sfx,1,100+rnd()*40)}

function pair(a,b,first){const dx=b.x-a.x,dy=b.y-a.y,d=hyp(dx,dy)||.01,ov=2*PR-d;if(ov<=0)return;
 const nx=dx/d,ny=dy/d,ma=a.blk>0?7:1,mb=b.blk>0?7:1,ta=ma+mb;
 a.x-=nx*ov*mb/ta;a.y-=ny*ov*mb/ta;b.x+=nx*ov*ma/ta;b.y+=ny*ov*ma/ta;
 if(!first)return;
 const same=tkey(a.p)===tkey(b.p),ah=!same&&a.dash>0&&(a.kx*nx+a.ky*ny)>150,bh=!same&&b.dash>0&&-(b.kx*nx+b.ky*ny)>150;
 if(ah&&bh){a.dash=b.dash=0;a.kx=-nx*480;a.ky=-ny*480;b.kx=nx*480;b.ky=ny*480;a.stun=b.stun=.25;fx((a.x+b.x)/2,(a.y+b.y)/2,20,'#ffffff',330,.45);
  pop((a.x+b.x)/2,(a.y+b.y)/2-40,TX_UI.clash,'#ffffff');SM.sh=Math.max(SM.sh,.5);beep(cfgG.sfx,1,200);return}
 if(ah){hit(a,b,nx,ny);return}if(bh){hit(b,a,-nx,-ny);return}
 const rv=(b.vx+b.kx-a.vx-a.kx)*nx+(b.vy+b.ky-a.vy-a.ky)*ny;
 if(rv<0){const j=-rv*.6;a.kx-=nx*j*mb/ta;a.ky-=ny*j*mb/ta;b.kx+=nx*j*ma/ta;b.ky+=ny*j*ma/ta}}

/* --- Bots --- */
function ai(q,dt){q.at-=dt;if(q.at>0)return;q.at=.07+rnd()*.06;const B=SM,dist=hyp(q.x-CX,q.y-CY),eff=B.warn?Math.min(B.R,B.Rt):B.R,rel=eff-dist,mg=Math.min(55,eff*.35);
 let tg=null,bd=1e9;for(const o of B.pl)if(o.al&&o!==q&&tkey(o.p)!==tkey(q.p)){const d=hyp(o.x-q.x,o.y-q.y);if(d<bd){bd=d;tg=o}}
 let mx=CX-q.x,my=CY-q.y;
 if(rel>mg&&tg){mx=tg.x-q.x;my=tg.y-q.y}
 if(rel>mg&&tg&&q.blk<=0&&bd<95&&q.dcd>0&&eff>110){mx=-mx;my=-my}
 const l=hyp(mx,my)||1,e=(1-q.sk)*.5;q.mv=[mx/l+(rnd()-.5)*e,my/l+(rnd()-.5)*e];
 if(!tg)return;
 let thr=false;for(const o of B.pl)if(o.al&&o!==q&&o.dash>0&&tkey(o.p)!==tkey(q.p)&&hyp(o.x-q.x,o.y-q.y)<150&&(o.kx*(q.x-o.x)+o.ky*(q.y-o.y))>0)thr=true;
 if(thr&&q.bcd<=0&&rnd()<.55*q.sk){doBlock(q);return}
 if(q.dcd<=0&&q.stun<=0&&q.blk<=0&&bd<170&&rel>mg*.9&&rnd()<.4*q.sk){
  let fxv=tg.x-q.x,fyv=tg.y-q.y;const ll=hyp(fxv,fyv)||1;fxv/=ll;fyv/=ll;
  const rg=Math.min(215,bd+20),ex=q.x+fxv*rg,ey=q.y+fyv*rg;
  if(eff-hyp(ex-CX,ey-CY)>Math.min(16,eff*.2)){q.fx=fxv;q.fy=fyv;doDash(q)}}}

/* --- Update --- */
function upd(dt){const B=SM,S=B.pl;B.sh=Math.max(0,B.sh-dt*1.8);
 for(const p of B.pa){p.x+=p.vx*dt;p.y+=p.vy*dt;const f=Math.pow(.02,dt);p.vx*=f;p.vy*=f;p.t-=dt}B.pa=B.pa.filter(p=>p.t>0);
 for(const t of B.tx){t.y-=dt*50;t.t-=dt}B.tx=B.tx.filter(t=>t.t>0);
 for(const t of B.tr)t.t-=dt;B.tr=B.tr.filter(t=>t.t>0);
 if(B.bn&&(B.bn.t-=dt)<=0)B.bn=null;
 for(const f of B.fa){f.t+=dt;f.x+=f.vx*dt;f.y+=f.vy*dt;const k=Math.pow(.3,dt);f.vx*=k;f.vy*=k;f.r+=f.tv*dt}B.fa=B.fa.filter(f=>f.t<1);
 for(const q of S){if(q.em&&(q.em.t-=dt)<=0)q.em=null;q.an.sq*=Math.exp(-dt*9)}
 if(B.cd>0){B.cd-=dt;cdTick(Math.max(0,Math.ceil(B.cd)));return}
 B.t+=dt;
 /* Plattform schrumpft in Stufen, vorher blinkt der Rand rot */
 if(B.si<B.stg.length){const[ts,rs]=B.stg[B.si];
  if(!B.warn&&B.t>=ts-2.4){B.warn=1;B.Rt=rs;banner(TX_UI.edge);beep(cfgG.sfx,1,330);setTimeout(()=>beep(cfgG.sfx,1,330),180)}
  if(B.t>=ts){B.warn=0;B.shr=1;B.si++;B.sh=Math.max(B.sh,.5);beep(cfgG.sfx,1,110)}}
 else if(B.end==null){B.R=Math.max(16,B.R-(B.R>70?5:8)*dt);B.Rt=B.R;if(!B.sd){B.sd=1;banner(TX_UI.sudden)}}
 if(B.shr){B.R=Math.max(B.Rt,B.R-110*dt);if(B.R<=B.Rt)B.shr=0;
  for(let i=0;i<3;i++){const a=rnd()*6.283;B.pa.push({x:CX+Math.cos(a)*B.R,y:CY+Math.sin(a)*B.R,vx:(rnd()-.5)*60,vy:60+rnd()*140,t:.7,L:.7,c:'#7a6cff',s:4+rnd()*5})}}
 /* Spieler */
 for(const q of S){if(!q.al)continue;
  q.dash=Math.max(0,q.dash-dt);q.dcd=Math.max(0,q.dcd-dt);q.bcd=Math.max(0,q.bcd-dt);q.blk=Math.max(0,q.blk-dt);q.stun=Math.max(0,q.stun-dt);
  if(q.bot)ai(q,dt);
  let dx,dy;
  if(q.bot){dx=q.mv[0];dy=q.mv[1]}
  else{const b=(P[q.p.id]||{b:0}).b;dx=b&1?-1:b&2?1:0;dy=b&32?-1:b&64?1:0;const l=hyp(dx,dy);if(l){dx/=l;dy/=l}}
  const can=q.stun<=0&&q.dash<=0&&q.blk<=0;
  if(can&&(dx||dy)){const l=hyp(dx,dy);q.fx=dx/l;q.fy=dy/l}
  const tx=can?dx*SPD:0,ty=can?dy*SPD:0,ac=Math.min(1,dt*(can?8:5));
  q.vx+=(tx-q.vx)*ac;q.vy+=(ty-q.vy)*ac;
  const kd=Math.exp(-dt*(q.dash>0?2.2:q.blk>0?9:3.4));q.kx*=kd;q.ky*=kd;
  q.x+=(q.vx+q.kx)*dt;q.y+=(q.vy+q.ky)*dt;
  const sp=hyp(q.vx,q.vy);if(sp>20)q.an.wt+=dt*(6+sp*.04);
  if(q.dash>0)B.tr.push({x:q.x,y:q.y,t:.2,c:pcol(q.p)})}
 for(let it=0;it<2;it++)for(let i=0;i<S.length;i++)for(let j=i+1;j<S.length;j++)if(S[i].al&&S[j].al)pair(S[i],S[j],!it);
 for(const q of S)if(q.al&&hyp(q.x-CX,q.y-CY)>B.R+4)out(q);
 if(B.end==null&&new Set(alive().map(q=>tkey(q.p))).size<=1){B.end=3.4;B.slo=1;const w=alive()[0];if(w)pop(w.x,w.y-100,TX_UI.winnerBig,'#ffc83d');jingle()}
 if(B.end!=null&&(B.end-=dt)<=0)fin()}

function fin(){const B=SM;B.done=1;
 award(B.pl.map(q=>({p:q.p,v:q.al?1e6:q.dt,txt:q.al?TX_UI.winner:Math.round(q.dt)+' s'})),T?'':stAw().join(' · '),null,'max')}

/* --- Pause / Eingabe --- */
const lost=()=>SM?SM.pl.filter(q=>q.al&&!q.bot&&(/^gp/.test(q.p.id)?!P[q.p.id]:!fixed(q.p.id)&&(!P[q.p.id]||Date.now()-P[q.p.id].seen>4000))):[];
const PZ=makePause({obj:()=>SM,zone:'spz',note:'spn',rows:'spr',click:'smPzClick',lost,autoPause:B=>B.end==null,
 drop:()=>lost().forEach(q=>out(q,1)),restart:()=>launch(lastG==null?2:lastG)});
window.smPzClick=i=>PZ.click(i);
GS.sm={input(p,dn){if(!SM)return;if(SM.pz)PZ.input(dn);else if(dn(16))PZ.pause(1,p.name);else if(dn(4))act(p.id,4);else if(dn(8)||dn(128))act(p.id,8)},
 pauseKey:r=>PZ.toggle(r),blur:()=>PZ.blur()};

/* --- Musik: treibende Taiko-Bassline, wird mit der Zeit schneller --- */
const MU={next:0,step:0,g:null,nz:null},AR=[0,3,7,10,12,10,7,3],CH=[0,-4,-2,-5];
function mn(f,t0,d,ty,v){const o=bc.createOscillator(),g=bc.createGain();o.type=ty;o.frequency.setValueAtTime(f,t0);g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+.012);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(MU.g);o.start(t0);o.stop(t0+d+.03)}
function mdrum(t0,f0,f1,v,d){const o=bc.createOscillator(),g=bc.createGain();o.frequency.setValueAtTime(f0,t0);o.frequency.exponentialRampToValueAtTime(f1,t0+d*.8);g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(MU.g);o.start(t0);o.stop(t0+d+.02)}
function mhat(t0,v){if(!MU.nz){const n=bc.sampleRate*.05|0,b=bc.createBuffer(1,n,bc.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(rnd()*2-1)*(1-i/n);MU.nz=b}
 const s=bc.createBufferSource(),f=bc.createBiquadFilter(),g=bc.createGain();s.buffer=MU.nz;f.type='highpass';f.frequency.value=7000;g.gain.value=v;s.connect(f);f.connect(g);g.connect(MU.g);s.start(t0)}
function mus(){const B=SM;if(!B||B.done||B.pz||B.end!=null||cfgG.mus<=0||gvol(2)<=0){MU.next=0;return}
 try{bc=bc||new(window.AudioContext||window.webkitAudioContext)();if(bc.state==='suspended')bc.resume();if(bc.state!=='running')return;
  if(!MU.g){MU.g=bc.createGain();MU.g.connect(bc.destination)}
  MU.g.gain.value=.5*cfgG.mus/100*gvol(2);
  const now=bc.currentTime;if(!MU.next||MU.next<now-.3)MU.next=now+.05;
  const pr=Math.min(1,B.t/60),bpm=108+60*pr,sd=60/bpm/2;
  while(MU.next<now+.25){const s=MU.step++,k=s&7,t0=MU.next,ch=CH[(s>>3)&3],r=65.41*Math.pow(2,ch/12);
   if(k===0||k===3||k===4||k===6)mn(k===6?r*2:r,t0,sd*1.6,'triangle',.28);
   if(k===0||k===4||(pr>.4&&(k===2||k===6)))mdrum(t0,150,48,.38,.16);
   if(k===3||k===7)mdrum(t0,k===7?260:200,110,.18,.14);
   mn(261.63*Math.pow(2,(ch+AR[k])/12),t0,sd*.8,'square',.026+.02*pr);
   if(pr>.25&&(k&1))mhat(t0,.05);
   MU.next+=sd}}catch(e){}}
function jingle(){if(cfgG.mus<=0||!bc||bc.state!=='running'||!MU.g)return;const t=bc.currentTime+.05;[0,4,7,12,16].forEach((n,i)=>mn(329.63*Math.pow(2,n/12),t+i*.11,.4,'square',.07))}

/* --- Zeichnen --- */
function draw(){const B=SM,cv=$('smc'),sc=Math.min(apPW()/W,innerHeight/H);
 const kq=Math.min(2.5,Math.max(.4,sc*apPR())),cwq=Math.round(W*kq),chq=Math.round(H*kq);if(cv.width!==cwq||cv.height!==chq){cv.width=cwq;cv.height=chq}cv.style.width=W*sc+'px';cv.style.height=H*sc+'px';
 const c=cv.getContext('2d'),now=B.ani||0,G=(col,b)=>{c.shadowColor=col;c.shadowBlur=b*apFX};
 const dis=(x,y,r)=>{c.beginPath();c.arc(x,y,r,0,7)};
 c.setTransform(kq,0,0,kq,0,0);c.clearRect(0,0,W,H);c.textBaseline='middle';
 const bg=apGr(c,'bg',0,()=>{const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,'#07051a');g.addColorStop(1,'#1a0b3d');return g});c.fillStyle=bg;c.fillRect(0,0,W,H);
 for(const s of B.stars){c.globalAlpha=.3+.5*Math.abs(Math.sin(now*s.f+s.p));c.fillStyle='#fff';c.fillRect(s.x,s.y,2,2)}c.globalAlpha=1;
 c.save();if(B.sh>0&&!B.pz)c.translate((rnd()-.5)*B.sh*16,(rnd()-.5)*B.sh*16);
 const R=B.R,gl=apGr(c,'gl',Math.round(R),()=>{const g=c.createRadialGradient(CX,CY+30,R*.5,CX,CY+30,R*1.6);g.addColorStop(0,'rgba(255,45,149,.2)');g.addColorStop(1,'rgba(255,45,149,0)');return g});c.fillStyle=gl;c.fillRect(0,0,W,H);
 /* Plattform mit Dicke */
 c.fillStyle='#0e0829';dis(CX,CY+20,R);c.fill();c.fillStyle='#160d3f';dis(CX,CY+12,R);c.fill();
 const pg=apGr(c,'pg',Math.round(R),()=>{const g=c.createRadialGradient(CX,CY-R*.25,R*.1,CX,CY,R);g.addColorStop(0,'#3a2e95');g.addColorStop(1,'#1d1660');return g});c.fillStyle=pg;dis(CX,CY,R);c.fill();
 c.strokeStyle='#ffffff12';c.lineWidth=2;for(let r=R-44;r>30;r-=48){dis(CX,CY,r);c.stroke()}
 c.beginPath();for(let k=0;k<12;k++){const a=k*.5236+now*.04;c.moveTo(CX+Math.cos(a)*40,CY+Math.sin(a)*40);c.lineTo(CX+Math.cos(a)*(R-3),CY+Math.sin(a)*(R-3))}c.stroke();
 c.strokeStyle='#ff2d95';c.lineWidth=4;G('#ff2d95',10);dis(CX,CY,34);c.stroke();G('transparent',0);
 G('#18c9e8',18);c.strokeStyle='#18c9e8';c.lineWidth=6;dis(CX,CY,R);c.stroke();G('transparent',0);
 if(B.warn){const a=.35+.35*Math.sin(now*14);c.fillStyle=`rgba(255,40,60,${a*.4})`;c.beginPath();c.arc(CX,CY,R,0,7);c.moveTo(CX+B.Rt,CY);c.arc(CX,CY,B.Rt,0,7,true);c.fill();
  c.strokeStyle=`rgba(255,80,80,${a+.3})`;c.lineWidth=7;c.setLineDash([18,14]);dis(CX,CY,B.Rt);c.stroke();c.setLineDash([])}
 /* Staubspur beim Dash */
 for(const t of B.tr){c.globalAlpha=t.t/.2*.35;c.fillStyle=t.c;dis(t.x,t.y+10,PR*.9);c.fill()}c.globalAlpha=1;
 const live=[...B.pl].filter(q=>q.al).sort((a,b)=>a.y-b.y),k=.52;
 for(const q of live){c.fillStyle='#0005';c.beginPath();c.ellipse(q.x,q.y+PR*.6+1,PR*.95,8,0,0,7);c.fill();
  if(TMON&&q.p.tm){c.beginPath();c.ellipse(q.x,q.y+PR*.6+1,PR*1.2,10,0,0,7);c.strokeStyle='#fff';c.lineWidth=7;c.stroke();c.strokeStyle=TC[q.p.tm-1];c.lineWidth=4;c.stroke()}
  const rd=1-q.dcd/DCD,rb=1-q.bcd/BCD;c.fillStyle='#0008';c.fillRect(q.x-19,q.y+PR+8,17,5);c.fillRect(q.x+2,q.y+PR+8,17,5);
  c.fillStyle=rd>=1?'#18c9e8':'#18c9e888';c.fillRect(q.x-19,q.y+PR+8,17*Math.min(1,rd),5);c.fillStyle=rb>=1?'#ff2d95':'#ff2d9588';c.fillRect(q.x+2,q.y+PR+8,17*Math.min(1,rb),5)}
 for(const f of B.fa){const s=Math.max(0,1-f.t);c.save();c.globalAlpha=s;c.translate(f.x,f.y+PR*.6+f.t*f.t*170);c.rotate(f.r);c.scale(s,s);c.drawImage(f.spr,14,2,116,158,-58*k,-152*k,116*k,158*k);c.restore()}
 for(const q of live){const A=q.an,hop=Math.abs(Math.sin(A.wt))*3*(hyp(q.vx,q.vy)>20?1:0),sq=A.sq,vxt=q.vx+q.kx;
  if(q.blk>0){const pf=q.blk>BDUR-PERF;c.fillStyle=pf?'rgba(255,255,255,.35)':'rgba(120,255,255,.2)';c.strokeStyle=pf?'#fff':'rgba(130,255,255,.9)';c.lineWidth=4;c.beginPath();c.ellipse(q.x,q.y-8,PR*1.55,PR*1.9,0,0,7);c.fill();c.stroke()}
  if(q.dash>0){c.strokeStyle='#ffffff99';c.lineWidth=3;c.beginPath();for(let i=-1;i<=1;i++){c.moveTo(q.x-q.fx*20+i*9*q.fy,q.y-q.fy*20-i*9*q.fx);c.lineTo(q.x-q.fx*56+i*9*q.fy,q.y-q.fy*56-i*9*q.fx)}c.stroke()}

 B.bolts.push({x:q.x,y:q.y-90,t:.22,c:pcol(q.p)});pop(B.bx+(rnd()-.5)*120,B.by+40,(txt?txt+' ':'')+d,txt?'#ff2d95':'#fff');fx(B.bx,B.by+30,txt?14:7,txt?'#ffc83d':pcol(q.p),230,.4);

 for(const p of B.pa){p.x+=p.vx*dt;p.y+=p.vy*dt;const f=Math.pow(.02,dt);p.vx*=f;p.vy*=f;p.t-=dt}B.pa=B.pa.filter(p=>p.t>0);

 if(B.bn&&(B.bn.t-=dt)<=0)B.bn=null;
 for(const q of S){if(q.hf>0)q.hf-=dt;if(q.fl)q.fl+=dt}
 if(B.sel){selTick(dt);return}
 if(B.cd>0){B.cd-=dt;cdTick(Math.max(0,Math.ceil(B.cd)));return}
 if(B.end!=null){if((B.end-=dt)<=0)fin();return}
 B.t+=dt;
 for(const q of S){q.hcd=Math.max(0,q.hcd-dt);q.bcd=Math.max(0,q.bcd-dt);q.acd=Math.max(0,q.acd-dt);q.sl=Math.max(0,q.sl-dt);
  if(q.hp<=0){q.hold=false;q.ch=0;continue}
  arMove(q,dt,B)}

 if(B.stun>0)B.stun-=dt;

 const hr=B.pl.filter(q=>!q.bot),rec=B.won&&hr.length&&B.dfi>0?{gi:4,v:Math.round(B.t),who:hr.map(q=>q.p.name).join(' + ').slice(0,24),low:1}:null;

const SPC=.8;
function arMove(q,dt,B){let l=0,r=0,j=0,bh=false;
 if(q.bot){if(q.hp>0){const tx=q.role!==1?B.bx-185-(q.i%3)*14:B.bx-340-(q.i%4)*46;if(Math.abs(q.x-tx)>12){if(q.x<tx)r=1;else l=1}
  if(q.on&&rnd()<dt*.4/q.sk)j=1;q.at-=dt;if(q.at<=0&&Math.abs(q.x-tx)<60){if(q.scd<=0&&rnd()<.22)useSpecial(q);else useMain(q);q.at=.4+rnd()*.5/q.sk}
  for(const f of B.fb)if(f.x>q.x&&f.x-q.x<240&&f.y>FY-120&&q.on)j=1;
  for(const w of B.wv)if(w.x>q.x&&w.x-q.x<200&&q.on&&rnd()<.75*q.sk+.2)j=1;
  for(const m of B.mt)if(Math.abs(m.x-q.x)<85&&m.t<m.W+.5){if(q.x<=m.x){l=1;r=0}else{r=1;l=0}}}}
 else{const pp=P[q.p.id],b=pp?pp.b:0;l=b&1;r=b&2;j=b&(32|4);bh=!!(b&(8|128));
  if(bh&&!q.bh)useMain(q);

  q.bh=bh}
 q.scd=Math.max(0,q.scd-dt);q.inv=Math.max(0,q.inv-dt);
 q.vx=((r?1:0)-(l?1:0))*270;if(q.vx)q.dir=q.vx>0?1:-1;else if(q.bot)q.dir=1;

 if(j&&q.on){q.vy=-950;q.on=0}

 if(q.spin>0){q.spin-=dt;if(!q.sh&&B.end==null&&Math.abs(q.x-B.bx)<235&&Math.abs(q.y-50-B.by)<190){q.sh=1;bossHit(q,90)}}}

 for(let i=B.mt.length-1;i>=0;i--){const m=B.mt[i];m.t+=dt;if(m.t<m.W)continue;m.y=-60+(m.t-m.W)*1500;
  if(m.y>=FY+4){B.mt.splice(i,1);B.sh=Math.max(B.sh,.25);fx(m.x,FY,16,'#ff8a2d',320,.6);beep(cfgG.sfx,1,90);arHit(B,m.x,FY-30,62,40,28*pr)}
  else arHit(B,m.x,m.y,30,30,28*pr)}

  if(a.k>=a.n){B.cur=null;B.nx=([2.4,1.8,1.3][ph]+rnd()*.8)/pr}}
 else if((B.nx-=dt)<=0&&!B.fb.length&&!B.wv.length&&!B.mt.length)arStart(B)}

/* --- Musik (leichter, düsterer Beat, wird mit den Phasen schneller) --- */
const MU={next:0,step:0,g:null};
function mn(f,t0,d,ty,v){const o=bc.createOscillator(),g=bc.createGain();o.type=ty;o.frequency.setValueAtTime(f,t0);g.gain.setValueAtTime(.0001,t0);g.gain.exponentialRampToValueAtTime(v,t0+.012);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(MU.g);o.start(t0);o.stop(t0+d+.03)}
function mdrum(t0,f0,f1,v,d){const o=bc.createOscillator(),g=bc.createGain();o.frequency.setValueAtTime(f0,t0);o.frequency.exponentialRampToValueAtTime(f1,t0+d*.8);g.gain.setValueAtTime(v,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+d);o.connect(g);g.connect(MU.g);o.start(t0);o.stop(t0+d+.02)}
function mus(){const B=BO;if(!B||B.done||B.pz||B.end!=null||cfgG.mus<=0||gvol(2)<=0){MU.next=0;return}
 try{bc=bc||new(window.AudioContext||window.webkitAudioContext)();if(bc.state==='suspended')bc.resume();if(bc.state!=='running')return;
  if(!MU.g){MU.g=bc.createGain();MU.g.connect(bc.destination)}
  MU.g.gain.value=.5*cfgG.mus/100*gvol(2);
  const now=bc.currentTime;if(!MU.next||MU.next<now-.3)MU.next=now+.05;
  const ph=B.ph,bpm=96+22*ph,sd=60/bpm/2,AR=[0,0,3,0,5,3,7,3],CH=[0,-2,-4,-2];
  while(MU.next<now+.25){const s=MU.step++,k=s&7,t0=MU.next,ch=CH[(s>>3)&3],r=55*Math.pow(2,ch/12);
   if(k===0||k===3||k===4||k===6)mn(r,t0,sd*1.5,'sawtooth',.12);
   if(k===0||k===4)mdrum(t0,140,45,.4,.18);
   if(ph>0&&(k===2||k===6))mdrum(t0,200,90,.16,.12);
   if(ph>1||k%2===0)mn(220*Math.pow(2,(ch+AR[k])/12),t0,sd*.7,'square',.02+.01*ph);
   MU.next+=sd}}catch(e){}}
function jingle(){if(cfgG.mus<=0||!bc||bc.state!=='running'||!MU.g)return;const t=bc.currentTime+.05;[0,4,7,12,16].forEach((n,i)=>mn(329.63*Math.pow(2,n/12),t+i*.11,.4,'square',.07))}

 const kq=Math.min(2.5,Math.max(.4,sc*apPR())),cwq=Math.round(W*kq),chq=Math.round(H*kq);if(cv.width!==cwq||cv.height!==chq){cv.width=cwq;cv.height=chq}cv.style.width=W*sc+'px';cv.style.height=H*sc+'px';

t=\"grab\">Greifen<\/div><div class=\"tb\" id=\"tj\" data-k=\"j\" data-t=\"jump\">Sprung<\/div>\n <div class=\"tb\" id=\"te\" data-k=\"e\">♥<\/div><div class=\"tb\" id=\"tz\" data-k=\"pz\">II<\/div>\n<\/div><\/div>\n<div id=\"rot\"><b>↻<\/b><span data-t=\"rot\">Bitte das Handy quer halten.<\/span><\/div>\n<script>\nvar FXQ=1,PRQ=1,FK=1; /* von der Hauptseite gesetzt: Glühfaktor, Pixel-Ratio; FK = Canvas-Skalierung */\n/* Texte zentral (für späteres Englisch, 24.11.2026). Elemente mit data-t werden beim Start aus FT gefüllt. */\nconst FT={over:'Überschwemmt!',next:'Weiter',pause:'Pause',drop:'Ohne sie weiter',restart:'Neustart',menu:'Zum Menü',grab:'Greifen',jump:'Sprung',rot:'Bitte das Handy quer halten.',blur:'Fenster nicht aktiv.',\n hints:['Spieler 1: A D W + S','Spieler 2: ← → ↑ + ↓','Spieler 3: J L I + K','Spieler 4: Num 4 6 8 + 5','','','',''],names:['Rot','Cyan','Grün','Pink','Gelb','Orange','Lila','Weiß'],\n shield:'Schild kaputt',rising:'Das Wasser steigt! Klettere nach oben.',pl:'Spieler ',back:' ist zurück!',capLost:'Kapsel verloren',newRec:'Neuer Rekord!',best:'Beste Punktzahl: ',pts:'Punkte ',\n hTouch:'◀ ▶ laufen · Sprung-Taste springen · ♥ Emote',hKb:'A / D oder ← / → laufen · W, ↑ oder Leertaste springen · E Emote',others:'× Controller/Handy/Touch',lostA:'Verbindung verloren: ',lostB:'. Das Handy verbindet sich von selbst wieder.',paused:'Das Spiel ist angehalten.',pby:' hat pausiert.',rsq:'Wirklich neu starten?'};\ndocument.querySelectorAll('[data-t]').forEach(e=>{e.textContent=FT[e.dataset.t]});\nconst W=1280,H=720,S=44,MAXG=800;\nconst cv=document.getElementById('c');let ctx=cv.getContext('2d');cv.width=W;cv.height=H;\nconst $=id=>document.getElementById(id);\nconst DIFF=[{n:'Leicht',f:1.4},{n:'Normal',f:1},{n:'Schwer',f:.72}];\nlet cfg={sound:true,music:true,vib:true,rain:true,diff:1},bestVal=0;\nfunction fit(){const st=$('stage'),s=Math.min(st.clientWidth/W,st.clientHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px';const k=Math.min(2.5, unction crateSprite(sz,k){const key=sz+k;if(spr[key])return spr[key];const cn=document.createElement('canvas');cn.width=cn.height=sz;const b=cn.getContext('2d');\n const fr={n:'#5aa0ff',x:'#ff4a2e',g:'#ffe14a'}[k],bd={n:'#141a33',x:'#2a0e12',g:'#33290a'}[k];\n b.fillStyle=bd;b.fillRect(0,0,sz,sz);\n b.strokeStyle='rgba(255,255,255,.06)';b.lineWidth=1;for(let y=11;y<sz;y+=11){b.beginPath();b.moveTo(0,y);b.lineTo(sz,y);b.stroke()}\n b.shadowColor=fr;b.shadowBlur=6;b.strokeStyle=fr;b.lineWidth=sz>S?5:3.5;b.strokeRect(3,3,sz-6,sz-6);\n const m=sz>S?18:8;if(sz>S)b.strokeRect(m,m,sz-2*m,sz-2*m);\n b.lineWidth=sz>S?4:2.5;b.beginPath();b.moveTo(m,m);b.lineTo(sz-m,sz-m);b.moveTo(sz-m,m);b.lineTo(m,sz-m);b.stroke();b.shadowBlur=0;\n b.fillStyle=fr;[[7,7],[sz-7,7],[7,sz-7],[sz-7,sz-7]].forEach(q=>{b.beginPath();b.arc(q[0],q[1],sz>S?3:1.8,0,6.3);b.fill()});\n if(k!=='n'){b.fillStyle=k==='x'?'#fff':'#fff6c0';b.strokeStyle=bd;b.lineWidth=5;b.font='700 '+(sz*.55|0)+'px Rajdhani,sans-serif';b.textAlign='center';b.strokeText(k==='x'?'!':'$',sz/2,sz*.7);b.fillText(k==='x'?'!':'$',sz/2,sz*.7)}\n return spr[key]=cn}\n\n/* ---------- Zustand ---------- */\nconst g=new Float32Array(W),keys={};\nconst cg=new Float32Array(W).fill(1e9),cb=new Float32Array(W);\nconst lay=document.createElement('canvas');lay.width=W;lay.height=H;const lctx=lay.getContext('2d');\nconst gAt=x=>{const i=x<0?0:x>=W?W-1:x|0;return g[i]<cg[i]?g[i]:cg[i]};\nfunction resetTerrain(){cg.fill(1e9);for(let x=0;x<W;x++)g[x]=600+Math.sin(x/170)*14+Math.sin(x/47)*5}\nresetTerrain();\nlet state='menu',mode=1,t=0,time=0,players=[],crates=[],rockets=[],parts=[],shake=0,flash=0,nextCrate=0,nextRocket=0,endT=0,wl=692;\nconst drops=Array.from({length:170},()=>({x:Math.random()*W,y:Math.random()*H,l:10+Math.random()*14,v:900+Math.random()*400}));\nconst down=a=>a.some(k=>keys[k]);\naddEventListener('keydown',e=>{keys[e.code]=true;try{parent.fKey(e,1)}catch(_){}if(state==='play'&&!e.repeat){const k=EK.indexOf(e.code);if(k>=0){const p=mode===1?players[0]:players.find(z=>z.i===k);if(p&&p.pad==null)emote(p)}}if(/^(Arrow|Space)/.test(e.code))e.preventDefault();if((e.code==='Escape'||e.code==='KeyP')&&!e.repeat){if(state==='play')pauseGame('');else if(state==='pause')togglePause()}});\naddEventListener('keyup',e=>{keys[e.code]=false;try{parent.fKey(e,0)}catch(_){}});\naddEventListener('blur',()=>{for(const k in keys)keys[k]=false;if(state==='play')pauseGame(FT.blur)});\n\n/* ---------- Ton ---------- */\nlet ac;function initAudio(){if(!ac){try{ac=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(ac&&ac.state==='suspended')ac.resume()}\nfunction sfx(k,v){if(!cfg.sound||!ac)return;const n=ac.currentTime;\n if(k==='boom'){const len=ac.sampleRate*.7|0,buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);\n  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.4);\n  const s=ac.createBufferSource(),f=ac.createBiquadFilter(),gn=ac.createGain();s.buffer=buf;f.type='lowpass';f.frequency.value=650;gn.gain.value=.55*v/60;\n  s.connect(f);f.connect(gn);gn.connect(ac.destination);s.start(n)}\n else if(k==='emote'){const o=ac.createOscillator(),gn=ac.createGain();o.type='sine';o.frequency.setValueAtTime(660,n);o.frequency.exponentialRampToValueAtTime(990,n+.12);gn.gain.setValueAtTime(.12,n);gn.gain.exponentialRampToValueAtTime(.001,n+.2);o.connect(gn);gn.connect(ac.destination);o.start(n);o.stop(n+.22)}\n else{const o=ac.createOscillator(),gn=ac.createGain();o.frequency.setValueAtTime(120,n);o.frequency.exponentialRampToValueAtTime(40,n+.15);\n  gn.gain.setValueAtTime(.2,n);gn.gain.exponentialRampToValueAtTime(.001,n+.18);o.connect(gn);gn.connect(ac.destination);o.start(n);o.stop(n+.2)}}\n\n/* ---------- Musik ---------- */\nconst MUS={next:0,step:0,gain:null,noise:null},PROG=[[0,[0,3,7]],[-4,[0,4,7]],[3,[0,4,7]],[-2,[0,4,7]]],ARP=[0,1,2,1,2,1,0,2];\nfunction mNote(f,t0,d,ty,v){const o=ac.createOscillator(),gn=ac.createGain();o.type=ty;o.frequency.setValueAtTime(f,t0)
